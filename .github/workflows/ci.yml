# Las mismas validaciones que se ejecutan en local con pre-commit,
# lanzadas por GitHub en cada push y pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pre-commit run --all-files
