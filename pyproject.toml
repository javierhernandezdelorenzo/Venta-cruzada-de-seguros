[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xsell"
version = "0.1.0"
description = "Modelo de propensión para venta cruzada de seguro de vehículo"
requires-python = ">=3.11"
# Versiones fijadas: mismas librerías = mismos resultados en cualquier máquina.
dependencies = [
    "pandas==3.0.5",
    "scikit-learn==1.9.1",
    "xgboost==3.4.1",
    "mlflow==3.18.0",
    "matplotlib==3.11.2",
    "pyyaml==6.0.3",
    "fastapi==0.162.7",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "pytest==9.1.1",
    "httpx==0.28.1",       # lo necesita el cliente de test de FastAPI
    "ruff==0.17.5",
    "pre-commit==4.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# E/W: estilo, F: errores (imports sin usar, variables no definidas), I: orden de imports
select = ["E", "W", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Hint. Inferred schema contains integer:UserWarning",
]
