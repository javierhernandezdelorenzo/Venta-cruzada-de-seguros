[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xsell"
version = "0.1.0"
description = "Modelo de propensión para venta cruzada de seguro de vehículo"
requires-python = ">=3.11"
# Versiones fijadas: mismas librerías = mismos resultados en cualquier máquina.
dependencies = [
    "pandas==3.0.5",
    "scikit-learn==1.9.1",
    "xgboost==3.4.1",
    "mlflow==3.18.0",
    "matplotlib==3.11.2",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
